principles:
  - name: Visibility
    description: Track per-org API consumption via API Usage Last 7 Days, System Overview, and Event Monitoring.
      Track flow interviews via Flow analytics in Setup; correlate with Apex governor metrics.
  - name: Allocation
    description: Allocate seat cost by org / business unit; allocate API headroom and Flow execution cost
      back to the integrations and automations driving consumption so noisy automations don't crowd out
      user-facing flows.
  - name: Optimization
    description: Migrate Process Builder / Workflow Rules to Flow; bulkify Flow + Apex; collapse per-record
      callouts; route high-volume data through Bulk API; right-size editions at renewal; retire unused
      flows.
  - name: Accountability
    description: Salesforce CoE / admin owns license + API consumption with finance; integration owners
      are accountable for their share of the 24-hour bucket. Set internal alerting at 60-70% of allowance.
